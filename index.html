<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DELSU Chem Bench — Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2027;
  --panel:#242B33;
  --panel-2:#2C3540;
  --bone:#EDEAE0;
  --muted:#9AA5AE;
  --line:#3A4450;
  --gold:#C89B3C;
  --teal:#5C93A8;
  --rust:#B06A46;
  --sage:#8A9A78;
  --plum:#9C7FA0;
  --clay:#C97D5C;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:'Source Serif 4', serif;
  min-height:100vh;
}
::selection{background:var(--gold);color:#1B2027;}
h1,h2,h3{font-family:'Fraunces', serif;font-weight:600;margin:0 0 .4em;}
.mono{font-family:'IBM Plex Mono', monospace;}
a{color:inherit;}

/* ---------- shell layout ---------- */
.shell{display:flex;min-height:100vh;}
.drawer{
  width:270px;flex:0 0 270px;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:28px 0 20px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.drawer-head{padding:0 22px 20px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.drawer-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
.drawer-head h1{font-size:22px;line-height:1.2;margin-top:6px;}
.drawer-head .sub{font-size:12.5px;color:var(--muted);margin-top:6px;font-family:'IBM Plex Mono',monospace;}

.course-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 22px;cursor:pointer;
  border-left:3px solid transparent;
  transition:background .15s;
}
.course-item:hover{background:var(--panel-2);}
.course-item.active{background:var(--panel-2);border-left-color:var(--accent);}
.course-item .swatch{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 9px;}
.course-item .label{font-size:14.5px;line-height:1.3;}
.course-item .code{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.06em;}

.progress-note{margin:18px 22px 0;padding-top:14px;border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);line-height:1.6;}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:36px 44px 80px;max-width:980px;}
.course-header{margin-bottom:8px;}
.course-header .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
.course-header h2{font-size:32px;margin-top:6px;}
.course-header .desc{color:var(--muted);font-size:15px;max-width:60ch;margin-top:4px;}

.tabbar{display:flex;gap:6px;margin:24px 0 26px;border-bottom:1px solid var(--line);}
.tabbtn{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;
  background:none;border:none;color:var(--muted);padding:10px 4px;margin-right:22px;cursor:pointer;
  border-bottom:2px solid transparent;
}
.tabbtn.active{color:var(--bone);border-bottom-color:var(--accent);}

.panel{display:none;}
.panel.active{display:block;}

/* notes */
.note-block{margin-bottom:26px;}
.note-block h3{font-size:19px;color:var(--accent);}
.note-block ul{margin:8px 0 0;padding-left:20px;}
.note-block li{margin-bottom:6px;line-height:1.55;font-size:15px;}
.note-block p{line-height:1.6;font-size:15px;}
table.datatab{border-collapse:collapse;width:100%;margin-top:10px;font-size:14px;}
table.datatab th,table.datatab td{border:1px solid var(--line);padding:7px 10px;text-align:left;}
table.datatab th{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--accent);letter-spacing:.05em;}

/* specimen cards (flashcards) */
.deck-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:16px;}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
.spec-card{
  perspective:1200px;height:180px;cursor:pointer;
}
.spec-inner{
  position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.spec-card.flipped .spec-inner{transform:rotateY(180deg);}
.spec-face{
  position:absolute;inset:0;backface-visibility:hidden;
  background:var(--panel-2);border:1px solid var(--line);border-radius:2px;
  padding:16px 16px 14px;display:flex;flex-direction:column;
}
.spec-face::before{
  content:'';position:absolute;top:10px;left:10px;width:8px;height:8px;border-radius:50%;
  background:var(--ink);border:1px solid var(--line);
}
.spec-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-left:20px;}
.spec-body{flex:1;display:flex;align-items:center;font-size:14.5px;line-height:1.45;margin-top:8px;}
.spec-face.back{transform:rotateY(180deg);background:var(--ink);}
.spec-hint{margin-top:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:right;}
.spec-card.known .spec-face:not(.back){border-color:var(--accent);}
.spec-mark{position:absolute;top:8px;right:10px;font-size:11px;}

.deck-controls{margin-top:16px;display:flex;gap:10px;}
.btn{
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--panel-2);border:1px solid var(--line);color:var(--bone);padding:9px 14px;cursor:pointer;border-radius:2px;
}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);color:#1B2027;border-color:var(--accent);font-weight:600;}

/* quiz */
.quiz-wrap{max-width:640px;}
.q-progress{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:14px;}
.q-card{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:24px;}
.q-text{font-size:17px;line-height:1.5;margin-bottom:18px;}
.q-opt{
  display:block;width:100%;text-align:left;background:var(--ink);border:1px solid var(--line);color:var(--bone);
  padding:11px 14px;margin-bottom:9px;border-radius:2px;cursor:pointer;font-size:14.5px;font-family:'Source Serif 4',serif;
}
.q-opt:hover{border-color:var(--accent);}
.q-opt.correct{border-color:var(--sage);background:#26302a;}
.q-opt.wrong{border-color:var(--clay);background:#332321;}
.q-opt[disabled]{cursor:default;}
.q-explain{margin-top:12px;font-size:13.5px;color:var(--muted);line-height:1.5;font-style:italic;}
.q-result{text-align:center;padding:40px 20px;}
.q-result .score{font-family:'Fraunces',serif;font-size:48px;color:var(--accent);}

footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;}

@media(max-width:820px){
  .shell{flex-direction:column;}
  .drawer{width:100%;height:auto;position:relative;flex:none;}
  main{padding:26px 20px 60px;}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="eyebrow">Delta State University · Abraka</div>
      <h1>Chem&nbsp;Bench</h1>
      <div class="sub">specimen index / exam prep</div>
    </div>
    <div id="courseList"></div>
    <div class="progress-note" id="progressNote"></div>
  </nav>

  <main>
    <div class="course-header">
      <div class="eyebrow" id="hdrEyebrow"></div>
      <h2 id="hdrTitle"></h2>
      <p class="desc" id="hdrDesc"></p>
    </div>

    <div class="tabbar">
      <button class="tabbtn active" data-tab="notes">Notes</button>
      <button class="tabbtn" data-tab="cards">Flashcards</button>
      <button class="tabbtn" data-tab="quiz">Quiz</button>
    </div>

    <div class="panel active" id="panel-notes"></div>
    <div class="panel" id="panel-cards"></div>
    <div class="panel" id="panel-quiz"></div>

  </main>
</div>

      'Ionic compounds form a giant 3-D lattice of alternating cations and anions held by strong, non-directional electrostatic (Coulombic) forces in every direction.',
      'Breaking the lattice requires overcoming these forces throughout the crystal — this needs a large amount of energy, so melting and boiling points are generally high (e.g. NaCl melts at 801°C).',
      'Lattice energy ∝ (charge on cation × charge on anion) / (interionic distance) — higher ionic charges and smaller ionic radii give stronger lattices and higher melting/boiling points (e.g. MgO, with 2+/2− ions, melts far higher than NaCl, with 1+/1− ions).'
    ]},
    {h:'2. Hardness', items:[
      'Hardness reflects resistance to scratching/indentation — determined by how strongly the lattice resists local displacement of ions.',
      'Because every ion is held by strong electrostatic attraction to several neighbours (fixed coordination number), most ionic crystals are hard.',
      'Hardness generally increases with lattice energy — small, highly charged ions (e.g. MgO) give harder crystals than large, singly charged ions (e.g. KI).'
    ]},
    {h:'3. Brittleness', items:[
      'Applying stress can shift one plane of ions relative to an adjacent plane by roughly one ion spacing.',
      'This shift brings ions of the SAME charge into direct alignment across the slip plane.',
      'The resulting strong like-charge repulsion splits the crystal apart suddenly along that plane — this is why ionic solids shatter rather than deform, unlike malleable metals (where electron-sea bonding tolerates layer slip).'
    ]},
    {h:'4. Cleavage', items:[
      'Because the lattice has a regular, repeating geometric arrangement, ionic crystals break preferentially along specific crystallographic planes — this is cleavage.',
      'The cleavage plane is the direction of weakest resistance to the like-charge-repulsion mechanism described above.',
      'Example: rock salt (NaCl) cleaves along planes parallel to the cube faces of its lattice, giving cubic cleavage fragments.'
    ]},
    {h:'5. Solubility', items:[
      'Ionic compounds tend to be soluble in polar solvents (especially water) and insoluble in non-polar solvents.',
      'Polar water molecules surround and stabilise individual ions (ion–dipole/hydration interactions), releasing hydration energy that can outweigh the lattice energy holding the crystal together.',
      'If lattice energy is very high relative to hydration energy (e.g. small, highly charged ions such as in CaCO₃, BaSO₄), the compound remains poorly soluble.',
      'Non-polar solvents (e.g. hexane) cannot stabilise separated ions, so ionic solids are essentially insoluble in them.'

/* =========================================================
   STATE + STORAGE
   ========================================================= */
const LS_KEY = 'chembench_progress_v1';
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem(LS_KEY, JSON.stringify(p)); }
let progress = loadProgress();

let state = { courseId: COURSES[0].id, tab:'notes', cardFlip:{}, quizIndex:0, quizScore:0, quizAnswered:false };

function getCourse(){ return COURSES.find(c=>c.id===state.courseId); }
function courseProgress(id){
  if(!progress[id]) progress[id] = { known:{}, bestScore:0, attempts:0 };
  return progress[id];
}

/* =========================================================
   RENDER: drawer
   ========================================================= */
function renderDrawer(){
  const list = document.getElementById('courseList');
  list.innerHTML = COURSES.map(c=>{
    const active = c.id===state.courseId ? 'active':'';
    return `<div class="course-item ${active}" style="--accent:var(${c.accent})" data-id="${c.id}">
      <span class="swatch"></span>
      <span class="label">${c.title}<span class="code">${c.code}</span></span>
    </div>`;
  }).join('');
  list.querySelectorAll('.course-item').forEach(el=>{
    el.addEventListener('click',()=>{ state.courseId = el.dataset.id; state.quizIndex=0; state.quizScore=0; state.quizAnswered=false; renderAll(); window.scrollTo(0,0);});
  });

  const totalCards = COURSES.reduce((s,c)=>s+c.cards.length,0);
  let knownCards = 0;
  COURSES.forEach(c=>{ const p=courseProgress(c.id); knownCards += Object.values(p.known).filter(Boolean).length; });
  document.getElementById('progressNote').innerHTML =
    `flashcards mastered: ${knownCards} / ${totalCards}<br>quiz best-scores saved locally`;
}

/* =========================================================
   RENDER: header + tabs
   ========================================================= */
function renderHeader(){
  const c = getCourse();
  document.querySelectorAll('.drawer').forEach(d=>d.style.setProperty('--accent', `var(${c.accent})`));
  document.getElementById('hdrEyebrow').textContent = c.code;
  document.getElementById('hdrEyebrow').style.color = `var(${c.accent})`;
  document.getElementById('hdrTitle').textContent = c.title;
  document.getElementById('hdrDesc').textContent = c.desc;
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+state.tab).classList.add('active');
}

/* =========================================================
   RENDER: notes
   ========================================================= */
function renderNotes(){
  const c = getCourse();
  const el = document.getElementById('panel-notes');
  el.style.setProperty('--accent', `var(${c.accent})`);
  el.innerHTML = c.notes.map(block=>`
    <div class="note-block" style="--accent:var(${c.accent})">
      <h3>${block.h}</h3>
      <ul>${block.items.map(i=>`<li>${i}</li>`).join('')}</ul>
    </div>`).join('');
}

/* =========================================================
   RENDER: flashcards
   ========================================================= */
function renderCards(){
  const c = getCourse();
  const p = courseProgress(c.id);
  const el = document.getElementById('panel-cards');
  const knownCount = Object.values(p.known).filter(Boolean).length;
  el.innerHTML = `
    <div class="deck-meta">${c.cards.length} specimen cards — click to flip, mark known when confident. Mastered: <span id="knownCount">${knownCount}</span> / ${c.cards.length}</div>
    <div class="deck" id="deckGrid"></div>
    <div class="deck-controls">
      <button class="btn" id="resetKnown">Reset mastered marks</button>
    </div>`;
  const grid = document.getElementById('deckGrid');
  c.cards.forEach((pair,i)=>{
    const known = !!p.known[i];
    const card = document.createElement('div');
    card.className = 'spec-card'+(known?' known':'');
    card.style.setProperty('--accent', `var(${c.accent})`);
    card.innerHTML = `
      <div class="spec-inner">
        <div class="spec-face">
          <span class="spec-mark">${known?'&#10003;':''}</span>
          <div class="spec-tag">No. ${String(i+1).padStart(2,'0')} — Term</div>
          <div class="spec-body">${pair[0]}</div>
          <div class="spec-hint">tap to reveal</div>
        </div>
        <div class="spec-face back">
          <div class="spec-tag">Definition</div>
          <div class="spec-body">${pair[1]}</div>
          <div class="spec-hint">tap = ✓ known</div>
        </div>
      </div>`;
    card.addEventListener('click', (e)=>{
      if(!card.classList.contains('flipped')){
        card.classList.add('flipped');
      } else {
        p.known[i] = !p.known[i];
        card.classList.toggle('known', p.known[i]);
        card.querySelector('.spec-mark').innerHTML = p.known[i] ? '&#10003;' : '';
        saveProgress(progress);
        document.getElementById('knownCount').textContent = Object.values(p.known).filter(Boolean).length;
        setTimeout(()=>card.classList.remove('flipped'), 350);
      }
    });
    grid.appendChild(card);
  });
  document.getElementById('resetKnown').addEventListener('click', ()=>{
    p.known = {}; saveProgress(progress); renderCards(); renderDrawer();
  });
}

/* =========================================================
   RENDER: quiz
   ========================================================= */
function renderQuiz(){
  const c = getCourse();
  const el = document.getElementById('panel-quiz');
  el.style.setProperty('--accent', `var(${c.accent})`);

  if(state.quizIndex >= c.quiz.length){
    const p = courseProgress(c.id);
    const pct = Math.round(100*state.quizScore/c.quiz.length);
    if(pct > p.bestScore) p.bestScore = pct;
    p.attempts = (p.attempts||0)+1;
    saveProgress(progress);
    el.innerHTML = `
      <div class="quiz-wrap"><div class="q-card q-result">
        <div class="mono" style="color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;">Result</div>
        <div class="score">${state.quizScore} / ${c.quiz.length}</div>
        <p style="color:var(--muted);">${pct}% — best saved score for this course: ${p.bestScore}%</p>
        <button class="btn primary" id="retryQuiz">Retry quiz</button>
      </div></div>`;
    document.getElementById('retryQuiz').addEventListener('click', ()=>{
      state.quizIndex=0; state.quizScore=0; state.quizAnswered=false; renderQuiz();
    });
    renderDrawer();
    return;
  }

  const item = c.quiz[state.quizIndex];
  el.innerHTML = `
    <div class="quiz-wrap">
      <div class="q-progress">Question ${state.quizIndex+1} of ${c.quiz.length} &nbsp;·&nbsp; Score ${state.quizScore}</div>
      <div class="q-card">
        <div class="q-text">${item.q}</div>
        <div id="optWrap"></div>
        <div class="q-explain" id="explainWrap" style="display:none;"></div>
        <div style="margin-top:16px;text-align:right;">
          <button class="btn primary" id="nextBtn" style="display:none;">Next →</button>
        </div>
      </div>
    </div>`;
  const optWrap = document.getElementById('optWrap');
  item.opts.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='q-opt'; b.textContent=opt;
    b.addEventListener('click', ()=>{
      if(state.quizAnswered) return;
      state.quizAnswered = true;
      const correct = i===item.a;
      if(correct) state.quizScore++;
      [...optWrap.children].forEach((btn,j)=>{
        btn.disabled = true;
        if(j===item.a) btn.classList.add('correct');
        else if(j===i) btn.classList.add('wrong');
      });
      document.getElementById('explainWrap').style.display='block';
      document.getElementById('explainWrap').textContent = (correct?'Correct. ':'Not quite. ') + item.e;
      document.getElementById('nextBtn').style.display='inline-block';
    });
    optWrap.appendChild(b);
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    state.quizIndex++; state.quizAnswered=false; renderQuiz();
  });
}

/* =========================================================
   TABS + INIT
   ========================================================= */
document.querySelectorAll('.tabbtn').forEach(b=>{
  b.addEventListener('click', ()=>{ state.tab=b.dataset.tab; renderHeader(); if(state.tab==='notes')renderNotes(); if(state.tab==='cards')renderCards(); if(state.tab==='quiz')renderQuiz(); });
});

function renderAll(){
  renderDrawer();
  renderHeader();
  renderNotes();
  renderCards();
  state.quizIndex=0; state.quizScore=0; state.quizAnswered=false;
  renderQuiz();
}
renderAll();
</script>
</body>
</html>
