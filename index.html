const notesNav = document.getElementById('notesNav');
const notesContent = document.getElementById('notesContent');

notesData.forEach((sec, i) => {
  const btn = document.createElement('button');
  btn.textContent = sec.title;
  btn.dataset.id = sec.id;
  if(i===0) btn.classList.add('active');
  btn.addEventListener('click', () => showSection(sec.id));
  notesNav.appendChild(btn);

  const div = document.createElement('div');
  div.className = 'note-section' + (i===0 ? ' active' : '');
  div.id = 'sec-' + sec.id;
  div.innerHTML = sec.html;
  notesContent.appendChild(div);
});

function showSection(id){
  document.querySelectorAll('.note-section').forEach(el => el.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  document.querySelectorAll('#notesNav button').forEach(b => b.classList.toggle('active', b.dataset.id === id));
}

/* ================= TABS ================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

/* ================= FLASHCARDS LOGIC ================= */
let flashOrder = flashData.map((_, i) => i);
let flashIndex = 0;
let showingAnswer = false;

const flashcardEl = document.getElementById('flashcard');
const flashContent = document.getElementById('flashContent');
const faceLabel = document.getElementById('faceLabel');
const flashCount = document.getElementById('flashCount');
const flashProgress = document.getElementById('flashProgress');

function renderFlash(){
  const item = flashData[flashOrder[flashIndex]];
  flashContent.textContent = showingAnswer ? item.a : item.q;
  faceLabel.textContent = showingAnswer ? 'ANSWER' : 'QUESTION';
  flashCount.textContent = `Card ${flashIndex + 1} of ${flashData.length}`;
  flashProgress.style.width = ((flashIndex + 1) / flashData.length * 100) + '%';
}

flashcardEl.addEventListener('click', () => { showingAnswer = !showingAnswer; renderFlash(); });
document.getElementById('flipBtn').addEventListener('click', () => { showingAnswer = !showingAnswer; renderFlash(); });
document.getElementById('nextBtn').addEventListener('click', () => {
  flashIndex = (flashIndex + 1) % flashData.length; showingAnswer = false; renderFlash();
});
document.getElementById('prevBtn').addEventListener('click', () => {
  flashIndex = (flashIndex - 1 + flashData.length) % flashData.length; showingAnswer = false; renderFlash();
});
document.getElementById('shuffleBtn').addEventListener('click', () => {
  for(let i = flashOrder.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [flashOrder[i], flashOrder[j]] = [flashOrder[j], flashOrder[i]];
  }
  flashIndex = 0; showingAnswer = false; renderFlash();
});
renderFlash();

/* ================= QUIZ LOGIC ================= */
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let answered = false;

document.getElementById('startQuizBtn').addEventListener('click', () => {
  const len = document.getElementById('quizLength').value;
  let pool = [...quizData];
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  quizQuestions = len === 'all' || parseInt(len) >= pool.length ? pool : pool.slice(0, parseInt(len));
  quizIndex = 0; quizScore = 0;
  document.getElementById('quizSetup').style.display = 'none';
  document.getElementById('quizResult').style.display = 'none';
  document.getElementById('quizActive').style.display = 'block';
  renderQuizQuestion();
});

function renderQuizQuestion(){
  answered = false;
  const q = quizQuestions[quizIndex];
  const container = document.getElementById('quizActive');
  container.innerHTML = `
    <div class="quiz-question">
      <div class="qnum">Question ${quizIndex + 1} of ${quizQuestions.length} · Score: ${quizScore}</div>
      <h3>${q.q}</h3>
      <div class="quiz-options">
        ${q.options.map((opt, i) => `<button data-i="${i}">${opt}</button>`).join('')}
      </div>
      <div class="quiz-footer">
        <span></span>
        <button id="nextQBtn" disabled>Next</button>
      </div>
    </div>
  `;
  container.querySelectorAll('.quiz-options button').forEach(btn => {
    btn.addEventListener('click', () => {
      if(answered) return;
      answered = true;
      const chosen = parseInt(btn.dataset.i);
      const buttons = container.querySelectorAll('.quiz-options button');
      buttons.forEach(b => {
        const bi = parseInt(b.dataset.i);
        if(bi === q.a) b.classList.add('correct');
        else if(bi === chosen) b.classList.add('wrong');
        b.disabled = true;
      });
      if(chosen === q.a) quizScore++;
      document.getElementById('nextQBtn').disabled = false;
      container.querySelector('.qnum').textContent = `Question ${quizIndex + 1} of ${quizQuestions.length} · Score: ${quizScore}`;
    });
  });
  document.getElementById('nextQBtn').addEventListener('click', () => {
    quizIndex++;
    if(quizIndex < quizQuestions.length){ renderQuizQuestion(); }
    else { showQuizResult(); }
  });
}

function showQuizResult(){
  document.getElementById('quizActive').style.display = 'none';
  const resultEl = document.getElementById('quizResult');
  const pct = Math.round((quizScore / quizQuestions.length) * 100);
  let msg = "Keep reviewing the notes!";
  if(pct >= 80) msg = "Excellent work! You know this well.";
  else if(pct >= 60) msg = "Good effort — review a bit more.";
  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <div class="score">${quizScore} / ${quizQuestions.length}</div>
    <p>${pct}% correct</p>
    <p>${msg}</p>
    <button id="retryBtn">Try Again</button>
  `;
  document.getElementById('retryBtn').addEventListener('click', () => {
    resultEl.style.display = 'none';
    document.getElementById('quizSetup').style.display = 'block';
  });
}
</script>
</body>
</html>
