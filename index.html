<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lagos Life Transfers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0c0a06;--line:#2b2414;--gold:#d4af37;--gold-hi:#f5dc8a;--gold-lo:#8a6d1c;--text:#f3ead2;--mute:#9a8f73;--bad:#e5735f;--ok:#8fcf8f;
--gold-grad:linear-gradient(135deg,#8a6d1c 0%,#f5dc8a 45%,#d4af37 60%,#7a5e14 100%)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:Jost,system-ui,sans-serif;font-weight:300;min-height:100%}
body{padding:max(20px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom));background:radial-gradient(800px 400px at 50% -100px,#2a2008 0%,#000 70%) no-repeat}
main{max-width:440px;margin:0 auto}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}
.brand{text-align:center;padding:22px 0 26px}
.brand h1{font-size:34px;letter-spacing:.04em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{color:var(--mute);margin-top:4px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.panel h2{font-size:24px;margin-bottom:14px;color:var(--gold-hi)}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input{width:100%;background:#000;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:14px;font:inherit;font-size:16px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:10px}.inline input{flex:1}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:10px;padding:14px 18px;border:1px solid var(--gold-lo);background:transparent;color:var(--gold-hi);transition:transform .15s,filter .2s}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
button.primary{width:100%;margin-top:20px;border:0;color:#1a1300;background:var(--gold-grad);font-size:16px;letter-spacing:.02em}
button.primary:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:20px;font-size:14px;margin-top:12px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.hidden{display:none!important}
/* the card: the one memorable element */
.card{position:relative;border-radius:18px;padding:22px 22px 20px;margin-bottom:16px;color:#1a1300;background:var(--gold-grad);box-shadow:0 18px 50px rgba(212,175,55,.18),inset 0 0 0 1px rgba(255,255,255,.25);overflow:hidden;min-height:180px}
.card::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.05) 14px 15px);pointer-events:none}
.card .top{display:flex;justify-content:space-between;align-items:baseline}
.card .name{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:22px}
.card .who{font-size:14px;opacity:.8}
.card .total{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:40px;margin:26px 0 4px;line-height:1}
.card .sub{font-size:14px;opacity:.8}
.bar{height:6px;background:#1a1300;border-radius:3px;margin:16px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold-hi);transition:width .3s}
.log{max-height:220px;overflow:auto;font-size:13px;line-height:1.7;color:var(--mute)}
.log div.ok{color:var(--ok)}.log div.bad{color:var(--bad)}
.who-line{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:14px}
.who-line button{padding:8px 12px;font-size:13px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold-lo);border-radius:16px;padding:24px;max-width:340px;width:calc(100% - 36px)}
dialog::backdrop{background:rgba(0,0,0,.8)}
dialog h2{color:var(--gold-hi);margin-bottom:10px}
dialog p{color:var(--mute);line-height:1.6;margin-bottom:18px}dialog b{color:var(--text);font-weight:500}
.btns{display:flex;gap:10px}.btns button{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="brand">
    <h1>Lagos Life Transfers</h1>
    <p>Private transfers, handled with care</p>
  </header>

  <section id="loginView" class="panel">
    <h2>Sign in</h2>
    <label for="user">Username</label>
    <input id="user" autocomplete="username" autocapitalize="none">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="primary" id="loginBtn">Sign in</button>
    <div class="msg" id="loginMsg" role="status"></div>
  </section>

  <section id="appView" class="hidden">
    <div class="who-line"><span id="whoami"></span><button id="logoutBtn">Sign out</button></div>

    <div class="card" aria-live="polite">
      <div class="top"><span class="name">Lagos Life</span><span class="who" id="cardTo">No recipient yet</span></div>
      <div class="total" id="cardTotal">₦0</div>
      <div class="sub" id="cardSub">Fill in the details below</div>
      <div class="bar"><i id="progress"></i></div>
      <div class="sub" id="cardStatus">Ready</div>
    </div>

    <div class="panel">
      <h2>New transfer</h2>
      <label for="recipient">Recipient username</label>
      <div class="inline">
        <input id="recipient" autocapitalize="none">
        <button id="findBtn">Find</button>
      </div>
      <div class="msg" id="findMsg" role="status"></div>

      <label for="amount">Amount per transfer (500, 20k, 5m, 10b)</label>
      <input id="amount" inputmode="text" placeholder="20k">
      <div class="row">
        <div><label for="count">Number of transfers</label><input id="count" type="number" min="1" value="1" inputmode="numeric"></div>
        <div><label for="delay">Delay in seconds</label><input id="delay" type="number" min="0" step="0.5" value="2" inputmode="decimal"></div>
      </div>
      <button class="primary" id="reviewBtn" disabled>Review transfer</button>
      <button id="stopBtn" class="hidden" style="width:100%;margin-top:12px">Stop sending</button>
      <div class="msg" id="sendMsg" role="status"></div>
    </div>

    <div class="panel hidden" id="logPanel"><h2>Activity</h2><div class="log" id="log"></div></div>
  </section>
</main>

<dialog id="confirm">
  <h2>Confirm transfer</h2>
  <p id="confirmText"></p>
  <div class="btns"><button id="cancelBtn">Cancel</button><button id="goBtn" class="primary" style="margin:0">Send</button></div>
</dialog>

<script>
const BASE = ""; // same origin: server.py forwards /api/* to the game
const $ = id => document.getElementById(id);
const fmt = n => "₦" + n.toLocaleString("en-NG");
let recipient = null, running = false, stopFlag = false;

function parseAmount(v){
  v = v.trim().toLowerCase().replace(/,/g,"");
  const m = v.match(/^(\d+(?:\.\d+)?)\s*([kmb]?)$/);
  if(!m) throw new Error("Use an amount like 500, 10k, 5m, or 10b");
  const n = parseFloat(m[1]) * {"":1,k:1e3,m:1e6,b:1e9}[m[2]];
  if(!Number.isInteger(n)) throw new Error("Amount must be a whole number");
  return n;
}
const sleep = s => new Promise(r => setTimeout(r, s*1000));
const say = (el, text, cls="") => { el.textContent = text; el.className = "msg " + cls; };

async function api(path, opts={}){
  try{
    return await fetch(BASE + path, {credentials:"include", ...opts});
  }catch(e){
    throw new Error("Could not reach the server. Make sure server.py is running in Termux.");
  }
}

function refreshCard(){
  $("cardTo").textContent = recipient ? recipient.username : "No recipient yet";
  try{
    const a = parseAmount($("amount").value), c = parseInt($("count").value);
    if(c > 0){ $("cardTotal").textContent = fmt(a*c); $("cardSub").textContent = c + " × " + fmt(a); }
  }catch{ $("cardTotal").textContent = "₦0"; $("cardSub").textContent = "Fill in the details below"; }
  $("reviewBtn").disabled = !recipient || running;
}
["amount","count","delay"].forEach(i => $(i).addEventListener("input", refreshCard));
$("recipient").addEventListener("input", () => { recipient = null; say($("findMsg"),""); refreshCard(); });

$("loginBtn").onclick = async () => {
  const u = $("user").value.trim(), p = $("pass").value;
  if(!u || !p) return say($("loginMsg"), "Enter your username and password.", "bad");
  $("loginBtn").disabled = true; say($("loginMsg"), "Signing in…");
  try{
    const r = await api("/api/auth/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username:u, password:p})});
    if(r.status !== 200) throw new Error("Sign in failed. Check your username and password.");
    $("pass").value = "";
    $("whoami").textContent = "Signed in as " + u;
    $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
    say($("loginMsg"), "");
  }catch(e){ say($("loginMsg"), e.message, "bad"); }
  $("loginBtn").disabled = false;
};
$("pass").addEventListener("keydown", e => { if(e.key==="Enter") $("loginBtn").click(); });

$("logoutBtn").onclick = () => { stopFlag = true; location.reload(); };

$("findBtn").onclick = async () => {
  const q = $("recipient").value.trim();
  if(!q) return say($("findMsg"), "Enter a username.", "bad");
  say($("findMsg"), "Searching…");
  try{
    const r = await api("/api/players?q=" + encodeURIComponent(q));
    if(r.status !== 200) throw new Error("Player search failed.");
    const list = ((await r.json()).players || []).filter(p => (p.username||"").toLowerCase() === q.toLowerCase());
    if(list.length !== 1) throw new Error("No unique player found with that username.");
    recipient = list[0];
    say($("findMsg"), "Recipient found: " + recipient.username, "ok");
  }catch(e){ recipient = null; say($("findMsg"), e.message, "bad"); }
  refreshCard();
};

let plan = null;
$("reviewBtn").onclick = () => {
  try{
    const amount = parseAmount($("amount").value);
    const count = parseInt($("count").value), delay = parseFloat($("delay").value);
    if(!(count > 0)) throw new Error("Enter at least 1 transfer.");
    if(!(delay >= 0)) throw new Error("Delay can't be negative.");
    plan = {amount, count, delay};
    $("confirmText").innerHTML = "Send <b>" + count + " × " + fmt(amount) + "</b> to <b>" + recipient.username + "</b>.<br>Total: <b>" + fmt(amount*count) + "</b>";
    $("confirm").showModal(); say($("sendMsg"), "");
  }catch(e){ say($("sendMsg"), e.message, "bad"); }
};
$("cancelBtn").onclick = () => $("confirm").close();

$("goBtn").onclick = async () => {
  $("confirm").close();
  const {amount, count, delay} = plan;
  running = true; stopFlag = false;
  $("reviewBtn").disabled = true; $("stopBtn").classList.remove("hidden");
  $("logPanel").classList.remove("hidden"); $("log").innerHTML = ""; $("progress").style.width = "0";
  const log = (t, c) => { const d = document.createElement("div"); d.textContent = t; d.className = c; $("log").prepend(d); };
  let sent = 0;
  for(let i = 1; i <= count; i++){
    if(stopFlag){ log("Stopped by you.", "bad"); break; }
    $("cardStatus").textContent = "Sending " + i + " of " + count;
    try{
      const r = await api("/api/send", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({to:recipient.id, amount, note:""})});
      const body = await r.text();
      log("[" + i + "/" + count + "] " + r.status + " " + body, r.status === 200 ? "ok" : "bad");
      if(r.status !== 200){ log("Transfer failed. Stopping.", "bad"); break; }
      sent++; $("progress").style.width = (i/count*100) + "%";
    }catch(e){ log(e.message, "bad"); break; }
    if(i < count) await sleep(delay);
  }
  $("cardStatus").textContent = "Finished: " + sent + " of " + count + " sent (" + fmt(sent*amount) + ")";
  say($("sendMsg"), "Finished.", sent === count ? "ok" : "bad");
  running = false; $("stopBtn").classList.add("hidden"); refreshCard();
};
$("stopBtn").onclick = () => { stopFlag = true; };
</script>
</body>
</html>
