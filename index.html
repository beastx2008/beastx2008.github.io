{

  title:"1. Fundamental Concepts",
  tag:"CHAPTER 1",
  html:`
  <div class="section">
    <h2>1.1 Introduction <span class="tag">CH.1</span></h2>
    <p>This chapter introduces types of impacts mining and mineral processing operations may have on the environment. Adequate knowledge of these impacts is important during site scoping, characterization, and alternative selection, giving insight into contaminants that may be present, threats to human health and the environment, and the feasibility of response actions.</p>
    <p>Globally there are several inactive and/or abandoned mines that may create significant impacts. The cumulative impact of multiple sites within a historic mining district often has the potential to impair beneficial uses of local land, surface, and groundwater resources.</p>
    <div class="callout"><b>Chapter outline:</b> Introduction &rarr; Metallurgy &rarr; Physical Metallurgy &rarr; Mechanical Metallurgy &rarr; Chemical Metallurgy &rarr; Powder Metallurgy &rarr; Engineering Metallurgy &rarr; Run-of-Mine Materials/Minerals.</div>
  </div>

  <div class="section">
    <h2>1.2 Metallurgy</h2>
    <p><b>Metallurgy</b> is a domain in material science and engineering. It may be defined as the study of the physical and chemical behavior of metallic elements and their mixtures, called <b>alloys</b>.</p>
    <p>Metallurgy can also be referred to as the various processes involved in the <b>extraction of metals from their ore, refining, and preparing them</b> for various applications.</p>
    <p>Metallurgy is broadly divided into:</p>
    <ul>
      <li><b>Extractive metallurgy</b></li>
      <li><b>Physical metallurgy</b></li>
    </ul>
    <p>Extractive metallurgy is further sub-divided into: mineral processing (ore dressing/beneficiation), electrometallurgy, hydrometallurgy, and pyrometallurgy. Physical metallurgy is further sub-divided into: mechanical metallurgy, chemical metallurgy, powder metallurgy, and engineering metallurgy.</p>
    <p>These branches, individually or collectively, enable metallurgy to play a pivotal role in 21st century science and technological advancement. Metallurgy also draws input from other disciplines: chemistry, physics, mathematics, chemical engineering, instrumentation technology, design engineering, etc.</p>

    <h3>Branches of Metallurgy (Fig. 1.1)</h3>
    <table>
      <tr><th>Branch</th><th>Focus</th></tr>
      <tr><td>Physical Metallurgy</td><td>Scientific study of materials, phase transformations, recovery and recrystallization, precipitation, hardening, structure-property correlations, characterization of microstructure</td></tr>
      <tr><td>Chemical Metallurgy</td><td>Extraction of materials from naturally occurring compounds through physical &amp; chemical treatments, refinement to levels of purity suitable for commercial application; chemical properties of materials guiding formation</td></tr>
      <tr><td>Mineral Processing / Beneficiation</td><td>Crushing and grinding to liberate desired substances from ore, physically entrapped with other or matrix, making them adaptable for further processing. Liberated materials undergo physical beneficiation e.g. magnetic separation, electrostatic separation, froth flotation</td></tr>
      <tr><td>Engineering Metallurgy</td><td>Processing of metals and materials in molten state, e.g. foundry, metal joining</td></tr>
      <tr><td>Powder Metallurgy</td><td>Production and processing of powdery forms of metals and materials</td></tr>
    </table>

    <h3>Extractive Metallurgy</h3>
    <p>Defined as the science and art of extracting metals from their ore, refining and processing them for specific applications. Major divisions:</p>
    <ul>
      <li>Mineral processing (beneficiation)</li>
      <li>Electrometallurgy</li>
      <li>Hydrometallurgy</li>
      <li>Pyrometallurgy</li>
    </ul>
    <p><b>Physical metallurgy</b> (winning of metal) is where the composition and treatment of metals are varied to provide desired physical and mechanical characteristics.</p>
  </div>

  <div class="section">
    <h2>1.3 Mineral Processing</h2>
    <p>Mineral processing can be broadly described as the physical and/or chemical processing methods of mineral resources which may lead to alterations in the physical or chemical characteristics of a mined ore, ultimately resulting in a processed mined product that is either ready for use or suited for further processing.</p>
    <p>Required to prepare and classify ores before valuable constituents can be concentrated and then forwarded for use or further treatment. Also called: <b>mineral dressing, ore dressing, mineral extraction, mineral beneficiation,</b> or <b>mineral engineering</b>.</p>

    <h3>Front-Row vs Back-Row Operations</h3>
    <p>Mineral processing operations are classified into <b>front-row</b> and <b>back-row</b> operations:</p>
    <ul>
      <li><b>Front-row operations</b> &mdash; essentially processes leading to material severance (crushing, screening, grinding, classification)</li>
      <li><b>Back-row operations</b> &mdash; separation of severed materials into two parts: valuable materials (concentrates) and non-valuable materials (gangue/tailings)</li>
    </ul>
    <p><b>Dewatering</b> forms a greater part of the whole scheme since most mineral processing operations are conducted wet.</p>

    <h3>Fig. 1.2 &mdash; Mineral Processing Flowsheet</h3>
    <div class="diagram-flow">
      <span class="flow-step">Run-of-mine</span><span class="flow-arrow">&darr;</span>
      <span class="flow-step">Crushing</span><span class="flow-arrow">&darr;</span>
      <span class="flow-step">Screening</span><span class="flow-arrow">&darr;</span>
      <span class="flow-step">Grinding</span><span class="flow-arrow">&darr;</span>
      <span class="flow-step">Classification</span><span class="flow-arrow">&darr;</span>
      <span class="flow-step">Input/Feed Stream</span><span class="flow-arrow">&darr;</span>
      <span class="flow-step">Separation</span>
    </div>
    <p>Oversize from crushing loops back to crushing (via screening); oversize from grinding loops back to grinding (via classification). Undersize exits classification into the feed stream.</p>
    <p>Separation splits into two paths:</p>
    <ul>
      <li><b>Valuable Mineral Product (Concentrate)</b> &rarr; Dewatering &rarr; Final Product (Concentrate)</li>
      <li><b>Waste/Gangue Materials (Tailings)</b></li>
    </ul>
    <div class="callout"><b>Remember:</b> Front-row = severance (crush/screen/grind/classify). Back-row = separation (concentrate vs tailings) + dewatering.</div>
  </div>

  <div class="section">
    <h2>1.1 Run-Of-Mine Material or Mineral</h2>
    <p>Mineral processing begins when an ore is delivered from a mine site to a processing facility. At this point, the ore is called <b>run-of-mine material or mineral</b> because no treatment has been performed on it.</p>
    <h3>Three Primary Classes of Run-of-Mine Material</h3>
    <ol>
      <li><b>Run-of-mine consisting of useful materials</b> &mdash; e.g. granites, building sand, limestone, coal, clays. Materials in this category are <u>not classified as minerals</u>.</li>
      <li><b>Run-of-mine containing useful minerals</b> &mdash; unit value is low but purity is high, approaching chemical grade. Used directly for industrial applications once separated from gangue that must be low to start with (low unit value allows only marginal treatment cost). Often called <b>industrial minerals</b>: apatite, fluorite, diamonds, gemstones, vermiculite, barite, wollastonite, chromite.
        <div class="callout">Barite is used as a weighing agent in oil-drilling mud; vermiculite is used as a sound and thermal insulator.</div>
      </li>
      <li><b>Run-of-mine containing value-bearing minerals</b> &mdash; the target mineral obtains its value from the contained metal. Such deposits are called <b>metaliferous ores</b> (e.g. magnetite Fe&#8323;O&#8324;). Example: ore containing <b>chalcopyrite (CuFeS&#8322;)</b> derives its value from the contained copper. Chalcopyrite itself has no direct use as a mineral &mdash; once concentrated, it requires further treatment (chemical: hydrometallurgical or pyrometallurgical methods) to extract copper.</li>
    </ol>
  </div>
  `

  <div class="section">
    <h2>Lab 1: Minerals and Mineral Ores <span class="tag">PART A</span></h2>
    <p>We live in a world dependent on minerals &mdash; used for aluminium/copper containers and wiring, fertilizers, manufactured products, etc. Geologists identify minerals in the field using <b>physical properties</b> and quick tests rather than expensive lab analyses, since each mineral has a distinct chemical composition and crystal structure (e.g. fluorite always consists of calcium and fluorine in a 1:2 ratio).</p>
    <p>Usually a combination of 4&ndash;5 observations/tests is needed to identify a mineral, since few minerals are distinctive enough to identify with a single test.</p>
  </div>

  <div class="section">
    <h2>Station 1: Color and Streak</h2>
    <p><b>Color</b> is among the more obvious qualities of a mineral, yet it may vary considerably with slight variations in chemical composition &mdash; even trace impurities can create strong color effects. E.g. corundum is commonly white/grayish, but with chromium it's deep red (<b>ruby</b>); with iron + titanium it's deep blue (<b>sapphire</b>).</p>
    <p><b>Streak</b> is the color of the fine powder of a mineral, observed by rubbing the mineral across unglazed porcelain (a <b>streak plate</b>). Streak is commonly <u>more reliable</u> than the color of the mineral itself.</p>
  </div>

  <div class="section">
    <h2>Station 2: Luster</h2>
    <p><b>Luster</b> describes how light reflects from a fresh mineral surface.</p>
    <ul>
      <li><b>Metallic luster</b> &mdash; appearance of metals, regardless of color</li>
      <li><b>Nonmetallic luster</b> &mdash; described as glassy (vitreous), milky, or earthy (dull)</li>
    </ul>
  </div>

  <div class="section">
    <h2>Station 3: Hardness &amp; the Mohs Scale</h2>
    <p><b>Hardness</b> is the resistance of a mineral to scratching, governed by crystal structure and bond strength &mdash; stronger bonds give a harder mineral.</p>
    <p><b>Test procedure:</b> first try to scratch with a fingernail (soft if it works). If not, try scratching a glass plate. If it can't scratch glass, hardness is between 2 and 5. If it CAN scratch glass, the mineral is hard &mdash; the easier it scratches glass, the greater the hardness difference.</p>
    <h3>Mohs Hardness Scale</h3>
    <table>
      <tr><th>#</th><th>Mineral</th><th>Common reference object</th></tr>
      <tr><td>1</td><td>Talc</td><td>&mdash;</td></tr>
      <tr><td>2</td><td>Gypsum</td><td>Fingernail</td></tr>
      <tr><td>3</td><td>Calcite</td><td>Copper penny</td></tr>
      <tr><td>4</td><td>Fluorite</td><td>&mdash;</td></tr>
      <tr><td>5</td><td>Apatite</td><td>Knife blade / Glass plate</td></tr>
      <tr><td>6</td><td>Potassium Feldspar</td><td>Steel file</td></tr>
      <tr><td>7</td><td>Quartz</td><td>&mdash;</td></tr>
      <tr><td>8</td><td>Topaz</td><td>&mdash;</td></tr>
      <tr><td>9</td><td>Corundum</td><td>&mdash;</td></tr>
      <tr><td>10</td><td>Diamond</td><td>&mdash;</td></tr>
    </table>
    <div class="callout"><b>Key fact:</b> A mineral scratched by quartz (7) but not by potassium feldspar (6) has a hardness between 6 and 7. 10 = hardest (diamond), 1 = softest (talc).</div>
  </div>

  <div class="section">
    <h2>Station 4: Cleavage and Fracture</h2>
    <p><b>Cleavage</b> is the tendency of minerals to break along flat surfaces &mdash; planes of weakness in the crystal structure. Some minerals (e.g. mica) have one set of parallel cleavage planes and repeatedly peel into smaller sheets. Others have two, three, or more cleavage planes, ranging from excellent to poor quality.</p>
    <p>Three things to evaluate when assessing cleavage:</p>
    <ol>
      <li>Number of different (non-parallel) cleavage planes</li>
      <li>The angle at which planes intersect</li>
      <li>Quality of cleavage: excellent, perfect, good, fair, poor</li>
    </ol>
    <p><b>Fracture</b> is the pattern in which a mineral breaks <u>other than</u> along cleavage planes &mdash; occurs when there are no planes of weak bonds. <b>Conchoidal fracture</b> creates smooth, curved surfaces and is common in <b>quartz</b>. Others fracture into splintery/fibrous fragments, or irregular shapes.</p>
  </div>

  <div class="section">
    <h2>Station 5: Density</h2>
    <p><b>Density</b> (mass per unit volume) determines how light or heavy a mineral feels. High-density minerals (e.g. gold) have closely packed atoms; low-density minerals (e.g. ice) have loosely packed atoms. Density relative to water is reported as <b>specific gravity (S.G.)</b>.</p>
    <p>Most common minerals: 2.5&ndash;3.0 g/cm&sup3;. Metallic minerals are higher:</p>
    <table>
      <tr><th>Mineral</th><th>Density</th></tr>
      <tr><td>Gold (Au)</td><td>19.3 g/cm&sup3;</td></tr>
      <tr><td>Silver (Ag)</td><td>10.5 g/cm&sup3;</td></tr>
      <tr><td>Copper (Cu)</td><td>8.9 g/cm&sup3;</td></tr>
      <tr><td>Galena (PbS)</td><td>7.5 g/cm&sup3;</td></tr>
    </table>
    <p>Density can be judged by <b>hefting</b> (holding) similarly-sized minerals and comparing weight.</p>
  </div>

  <div class="section">
    <h2>Station 6: Magnetism</h2>
    <p>Iron-bearing minerals often exhibit magnetism. <b>Magnetite</b> is strongly attracted to a magnet; <b>ilmenite</b> and <b>hematite</b> show weak attraction. Test: suspend a bar magnet on a string and slowly bring the mineral into its vicinity.</p>
  </div>

  <div class="section">
    <h2>Station 7: Reaction to Acid</h2>
    <p><b>Carbonate minerals</b> (containing the CO&#8323;&sup2;&#8315; anion) <b>effervesce (fizz)</b> when dilute HCl is applied &mdash; releasing CO&#8322; gas. <b>Calcite</b> effervesces vigorously; <b>dolomite</b> only effervesces if first powdered/scratched.</p>
    <div class="callout">If there's no reaction or a very slow one, scratch the mineral to powder and reapply the acid test.</div>
  </div>
  `
},
{
  id:"lab1b",
  title:"3. Lab 1B &mdash; Mineral Ores",
  tag:"LAB 1 · PART B",
  html:`
  <div class="section">
    <h2>Part B: Mineral Ores</h2>
    <p>Our technological world runs on mineral resources &mdash; everything not grown must be extracted from earth's upper crust and processed.</p>
    <p>Earth's mineral resources come from <b>rocks</b>, formed by three geologic processes: <b>igneous, sedimentary, and metamorphic</b>. Rocks are made of <b>minerals</b> &mdash; solid, inorganic chemical compounds. There are over <b>5,000 different mineral species</b> on Earth; some (like quartz) are extremely common, others are rare. A typical rock contains anywhere from <b>5&ndash;8 minerals</b>.</p>
    <h3>What Makes a Mineral an "Ore"?</h3>
    <p>To obtain a chemical element (e.g. aluminium) we must mine rock containing the relevant mineral (e.g. <b>bauxite</b>), then process it further to separate out the element. Although aluminium occurs in hundreds of minerals, only a few (like bauxite) contain it in high enough concentration to make extraction economical/feasible.</p>
    <div class="callout"><b>Mineral ores</b> = minerals that contain high concentrations of a desired chemical element.</div>
    <p>Not all minerals are ores &mdash; ore minerals form in special geologic situations and are rare in time and space, even though rocks (and minerals generally) are abundant.</p>
  </div>
  `
},
{
  id:"ch8intro",
  title:"4. Extraction of Metals &mdash; Introduction",
  tag:"CHAPTER 8",
  html:`
  <div class="section">
    <h2>Extraction of Metals</h2>
    <p>Metals have been part of human life for about <b>8000 years</b>. Civilized society began with tools made of metals. Metals like <b>iron, copper, and aluminium</b> form the basis of modern industry and technology.</p>
    <p>Metals are found in nature either in <b>elemental form</b> or as <b>compounds</b> with other materials. Compounds from which metals are separated are called <b>ores</b>. After removing impurities, pure metal is extracted from the compounds.</p>
    <p>The <b>least reactive metals</b> &mdash; gold, silver, platinum &mdash; occur in the <b>free (elemental) state</b>. More reactive metals form compounds with electronegative elements or radicals.</p>
    <p>Extraction is done by the <b>most simple method using the least amount of chemicals</b>, considering: availability of the ore, quantity of metal contained, and simplicity of the production method.</p>

    <h3>Table 8.1 &mdash; Metals, Ores &amp; Compositions</h3>
    <table>
      <tr><th>Metal</th><th>Compound</th><th>Formula</th></tr>
      <tr><td rowspan="2">Sodium</td><td>Rock salt</td><td class="chem">NaCl</td></tr>
      <tr><td>Chile salt petre</td><td class="chem">NaNO&#8323;</td></tr>
      <tr><td rowspan="2">Potassium</td><td>Carnalyte</td><td class="chem">KCl&middot;MgCl&#8322;&middot;6H&#8322;O</td></tr>
      <tr><td>Sylvin</td><td class="chem">KCl</td></tr>
      <tr><td rowspan="2">Magnesium</td><td>Magnetite</td><td class="chem">MgCO&#8323;</td></tr>
      <tr><td>Dolomite</td><td class="chem">MgCO&#8323;&middot;CaCO&#8323;</td></tr>
      <tr><td rowspan="2">Calcium</td><td>Gypsum</td><td class="chem">CaSO&#8324;&middot;2H&#8322;O</td></tr>
      <tr><td>Limestone/marble</td><td class="chem">CaCO&#8323;</td></tr>
      <tr><td rowspan="2">Aluminium</td><td>Bauxite</td><td class="chem">Al&#8322;O&#8323;&middot;2H&#8322;O</td></tr>
      <tr><td>Cryolite</td><td class="chem">Na&#8323;AlF&#8326;</td></tr>
      <tr><td rowspan="3">Iron</td><td>Magnetite</td><td class="chem">Fe&#8323;O&#8324;</td></tr>
      <tr><td>Haematite</td><td class="chem">Fe&#8322;O&#8323;</td></tr>
      <tr><td>Iron pyrites</td><td class="chem">FeS&#8322;</td></tr>
      <tr><td rowspan="3">Copper</td><td>Copper pyrites</td><td class="chem">CuFeS&#8322;</td></tr>
      <tr><td>Malachite</td><td class="chem">Cu(OH)&#8322;&middot;CuCO&#8323;</td></tr>
      <tr><td>Cuprite</td><td class="chem">Cu&#8322;O</td></tr>
      <tr><td rowspan="2">Zinc</td><td>Zinc blende</td><td class="chem">ZnS</td></tr>
      <tr><td>Calamine</td><td class="chem">ZnCO&#8323;</td></tr>
    </table>
  </div>
  `
},
{
  id:"concentration",
  title:"5. Concentration of Ore",
  tag:"CHAPTER 8",
  html:`
  <div class="section">
    <h2>Concentration of the Ore</h2>
    <p>Ores obtained from the earth's crust contain gravel, sand, and earthy impurities known as <b>gangue</b>. Gangue must be removed to get pure metal &mdash; this process is <b>concentration of ores</b>. The method depends on the nature of ore and gangue.</p>

    <h3>1. Washing in a Stream of Water</h3>
    <p>Used when the <b>density of impurities is less than that of the ore</b>. Powdered ore is washed in a stream of water; floating impurities are washed away, and the (denser) ore remains underneath.</p>

    <h3>2. Froth Floatation</h3>
    <p>Used when the <b>density of the ore is less than that of impurities</b>. Powdered ore is added to a mixture of pine oil and water, stirred by a strong current of air. Pine oil forms <b>froth</b>, and the ore wetted by pine oil floats with it &mdash; easily removed. This method is used for concentration of <b>sulphide ores</b>.</p>

    <h3>3. Magnetic Separation</h3>
    <p>If the ore is <b>magnetic</b>, it can be separated from impurities by passing it through a magnetic field (magnetic roller) &mdash; the magnetic ore is attracted towards the magnet, while non-magnetic impurities fall away separately.</p>

    <h3>4. Leaching</h3>
    <p>Used when impurities are <b>insoluble</b> but the ore is <b>soluble</b> in a solvent. Powdered ore reacts with the solvent; impurities remain unaffected. This concentration method is used for <b>bauxite</b>:</p>
    <div class="eqn">Al&#8322;O&#8323;&middot;2H&#8322;O + 2NaOH &rarr; 2NaAlO&#8322; + 3H&#8322;O</div>
    <p>Bauxite reacts with sodium hydroxide to form <b>sodium aluminate</b>.</p>
    <h4 style="color:var(--gold-bright);font-size:13.5px;margin:10px 0 4px;">Table 8.2 &mdash; Method of Concentration by Ore</h4>
    <table>
      <tr><th>Ore</th><th>Method of Concentration</th></tr>
      <tr><td>Copper glance</td><td>Froth floatation (sulphide ore)</td></tr>
      <tr><td>Bauxite</td><td>Leaching</td></tr>
      <tr><td>Haematite</td><td>Magnetic separation</td></tr>
      <tr><td>Zinc blende</td><td>Froth floatation (sulphide ore)</td></tr>
    </table>

    <h3>5. Roasting</h3>
    <p>Ore is crushed and heated in a strong blast of air, converting it to <b>oxides</b> &mdash; oxidised by oxygen in the air:</p>
    <div class="eqn">2PbS + 3O&#8322; &rarr; 2PbO + 2SO&#8322;<br>2ZnS + 3O&#8322; &rarr; 2ZnO + 2SO&#8322;</div>

    <h3>6. Calcination</h3>
    <p>Ores such as calcium carbonate are heated either in the absence of air or in a controlled air stream. Volatile impurities are removed by this method:</p>
    <div class="eqn">CaCO&#8323; &rarr; CaO + CO&#8322;</div>
  </div>
  `
},
{
  id:"extraction",
  title:"6. Extraction &amp; Refining of Metals",
  tag:"CHAPTER 8",
  html:`
  <div class="section">
    <h2>Extraction of Metals (from Concentrated Ore)</h2>
    <p>Depending on the nature of the ore, different methods are used for extraction:</p>

    <h3>1. Smelting</h3>
    <p>The roasted/calcined ore is mixed with <b>coke or charcoal</b> and heated strongly. Used for metals like <b>zinc, iron, nickel, lead, tin</b>.</p>
    <div class="eqn">SnO&#8322; + C &rarr; Sn + CO&#8322;</div>
    <p>Remaining impurities are removed by adding <b>flux</b>:</p>
    <ul>
      <li>If gangue is <b>acidic</b> (e.g. SiO&#8322;) &rarr; use a <b>basic flux</b> such as lime (CaO)</li>
      <li>If gangue is <b>basic</b> (e.g. SeO) &rarr; use an <b>acidic flux</b> (e.g. SiO&#8322;)</li>
    </ul>
    <p>Flux reacts with gangue to form <b>slag</b>, which floats over the molten metal (lower density) and is removed:</p>
    <div class="eqn">CaO + SiO&#8322; &rarr; CaSiO&#8323; (flux + gangue &rarr; slag)<br>P&#8324;O&#8321;&#8320; + 6CaO &rarr; 2Ca&#8323;(PO&#8324;)&#8322; (tricalcium phosphate)</div>

    <h3>2. Reduction with Aluminium</h3>
    <p>Metals like <b>manganese, chromium, vanadium</b> cannot be extracted by heating with carbon (they form carbides instead). These metals can be prepared by reducing their oxides with aluminium:</p>
    <div class="eqn">Cr&#8322;O&#8323; + 2Al &rarr; Al&#8322;O&#8323; + 2Cr</div>
    <p>Used for metals <b>less electropositive than aluminium</b>.</p>

    <h3>3. Reduction with Hydrogen</h3>
    <p>Used if other reducing agents aren't effective. E.g. tungsten:</p>
    <div class="eqn">WO&#8323; + 3H&#8322; &rarr; W + 3H&#8322;O</div>
  </div>

  <div class="section">
    <h2>Refining of Metals</h2>
    <p>Metals produced above still contain impurities. Removal of impurities from a <b>crude metal</b> is the <b>third step</b> in metal production.</p>

    <h3>1. Liquation</h3>
    <p>Metals with a <b>low melting point</b> (e.g. lead, tin) are heated on the <b>sloping hearth</b> of a furnace, allowing molten metal to flow away from infusible (solid) impurities. (Fig. 8.3: powdered raw metal &rarr; hopper &rarr; slanted plane &rarr; filter removes solid impurities &rarr; refined metal collected; residue impurities and gas outlet also shown.)</p>

    <h3>2. Distillation</h3>
    <p><b>Volatile metals</b> (e.g. mercury, zinc) are heated strongly and <b>distilled over</b>, leaving impurities behind.</p>

    <h3>3. Electrolysis</h3>
    <p>Highly electropositive metals are refined by electrolysis:</p>
    <ul>
      <li>Impure metal &rarr; <b>anode</b></li>
      <li>Any suitable substance &rarr; <b>cathode</b></li>
      <li>A compound of the metal &rarr; <b>electrolyte</b></li>
    </ul>
    <p>Pure metal deposits on the cathode.</p>
    <div class="eqn">At anode:   M &rarr; M&#8314; + e&#8315;<br>At cathode: M&#8314; + e&#8315; &rarr; M</div>
    <div class="callout"><b>Refining copper &mdash; example:</b><br>Anode: impure copper &nbsp;&bull;&nbsp; Cathode: pure copper &nbsp;&bull;&nbsp; Electrolyte: copper sulphate solution</div>
  </div>
  `
},
{
  id:"aluminium",
  title:"7. Extraction of Aluminium",
  tag:"CHAPTER 8",
  html:`
  <div class="section">
    <h2>Extraction of Aluminium</h2>
    <p><b>Bauxite</b> is the ore of aluminium &mdash; it is an oxide of aluminium. This ore is concentrated by <b>leaching</b> (using NaOH as the solvent):</p>
    <div class="eqn">Al&#8322;O&#8323;&middot;2H&#8322;O + 2NaOH &rarr; 2NaAlO&#8322; + 3H&#8322;O</div>
    <p>The compound formed is <b>sodium aluminate (NaAlO&#8322;)</b>, which is soluble in water. This solution is filtered and a little aluminium hydroxide is added &mdash; Al(OH)&#8323; precipitates out:</p>
    <div class="eqn">NaAlO&#8322; + 2H&#8322;O &rarr; Al(OH)&#8323; + NaOH</div>
    <p>The Al(OH)&#8323; is then heated strongly to get unhydrous <b>alumina (Al&#8322;O&#8323;)</b>:</p>
    <div class="eqn">2Al(OH)&#8323; &rarr; Al&#8322;O&#8323; + 3H&#8322;O</div>
    <p>Aluminium is obtained by <b>electrolysis of alumina</b> dissolved in fused <b>cryolite</b> (Fig. 8.5: Hall-H&eacute;roult-type cell):</p>
    <ul>
      <li><b>Carbon rods</b> &mdash; anode (+)</li>
      <li><b>Carbon lining</b> &mdash; cathode (&minus;)</li>
      <li>Iron tank contains molten aluminium oxide + cryolite; molten aluminium collects at the bottom and is drained via a plug</li>
    </ul>
    <div class="eqn">Al&#8322;O&#8323; &rarr; 2Al&sup3;&#8314; + 3O&sup2;&#8315;</div>
    <p>Al&sup3;&#8314; ions are attracted to the cathode (aluminium metal deposits there); O&sup2;&#8315; ions are attracted to the anode, where they react with the carbon anode (which is gradually consumed, forming CO&#8322;).</p>
    <div class="callout"><b>Why electrolysis?</b> Aluminium is highly electropositive and sits high in the reactivity series &mdash; it cannot be reduced by carbon (forms aluminium carbide instead), so electrolysis of molten alumina/cryolite is required.</div>

    <h3>Properties of Aluminium</h3>
    <ul>
      <li>Silvery white in colour</li>
      <li>Density 2.6 g/cm&sup3;</li>
      <li>Comparatively less hard</li>
      <li>Reducing property</li>
      <li>Conducts heat</li>
      <li>Reflects heat and light</li>
      <li>Conducts electricity</li>
    </ul>

    <h3>Uses of Aluminium</h3>
    <ul>
      <li>To make utensils</li>
      <li>To make automobile parts</li>
      <li>To make ice cube trays</li>
      <li>To make electrical wires</li>
      <li>To make roofs</li>
      <li>To use in reflecting telescopes</li>
      <li>To obtain metals from Cr&#8322;O&#8323;, Mn&#8322;O&#8323; (as a reducing agent)</li>
    </ul>
  </div>
  `
},
{
  id:"iron",
  title:"8. Extraction of Iron (Blast Furnace)",
  tag:"CHAPTER 8",
  html:`
  <div class="section">
    <h2>Extraction of Iron</h2>
    <p>Iron is the most important metal among the transition elements, and the most abundantly produced metal today. Ores of iron: <b>magnetite</b> and <b>haematite</b> (magnetic substances) &mdash; concentrated by <b>magnetic separation</b>.</p>
    <p>Iron ore is converted into iron in the <b>blast furnace</b>, reduced from Fe&#8322;O&#8323; using <b>coke</b>. The gangue in iron ore is usually <b>silica (SiO&#8322;)</b>; the flux used to remove it is <b>limestone (CaCO&#8323;)</b>:</p>
    <div class="eqn">CaCO&#8323; &rarr; CaO + CO&#8322;<br>CaO + SiO&#8322; &rarr; CaSiO&#8323; (slag)</div>

    <h3>Reactions Inside the Blast Furnace (Fig. 8.6)</h3>
    <table>
      <tr><th>Zone / Temp</th><th>Reactions</th></tr>
      <tr><td><b>500 K</b><br>Region where reduction takes place</td><td class="chem">3Fe&#8322;O&#8323; + CO &rarr; 2Fe&#8323;O&#8324; + CO&#8322;</td></tr>
      <tr><td><b>1000 K</b></td><td class="chem">CaCO&#8323; &rarr; CaO + CO&#8322;<br>Fe&#8323;O&#8324; + CO &rarr; 3FeO + CO&#8322;</td></tr>
      <tr><td><b>1500 K</b><br>Region where absorption takes place</td><td class="chem">C + CO&#8322; &rarr; 2CO<br>FeO + CO &rarr; Fe + CO&#8322;</td></tr>
      <tr><td><b>1800 K</b></td><td>Slag is formed; phosphates and silicates convert to phosphorous and silicon, dissolving into molten iron</td></tr>
      <tr><td><b>2000 K</b><br>Melting area</td><td class="chem">2C + O&#8322; &rarr; 2CO</td></tr>
    </table>
    <div class="callout">
      <b>Highest temperature:</b> the melting area (2000 K), near the hot air blasts at the base.<br>
      <b>Reducing agent:</b> Carbon monoxide (CO), formed from coke + O&#8322; (2C + O&#8322; &rarr; 2CO), and via C + CO&#8322; &rarr; 2CO.
    </div>
    <p>Hot air blasts enter from both sides at the base of the furnace, driving combustion of coke and generating the reducing gas CO that rises through the furnace to reduce the iron oxides.</p>
  </div>
  `
},
{
  id:"steel",
  title:"9. Steel, Heat Treatment &amp; Rusting",
  tag:"CHAPTER 8",
  html:`
  <div class="section">
    <h2>Pig Iron &amp; Steel</h2>
    <p>The large chunks of iron obtained from the blast furnace are called <b>pig iron</b>, which may contain impurities like carbon, sulphur, phosphorous, etc.</p>
    <p>To make <b>steel</b>: impurities in pig iron are first removed, then the required amount of other elements (e.g. carbon) is added to produce different types of steel.</p>

    <h3>Table 8.3 &mdash; Types of Steel</h3>
    <table>
      <tr><th>Type</th><th>% Carbon</th><th>Use</th></tr>
      <tr><td>Mild steel</td><td>0.05% &ndash; 0.2%</td><td>Wires, tubes, agricultural implements, rods</td></tr>
      <tr><td>Medium steel</td><td>0.21% &ndash; 0.6%</td><td>Railway tracks, girders, plates</td></tr>
      <tr><td>High carbon steel</td><td>0.61% &ndash; 1.5%</td><td>Surgical implements, springs, knife, drill</td></tr>
    </table>
  </div>

  <div class="section">
    <h2>Heat Treatment of Steel</h2>
    <p>Properties of steel (hardness, strength, ductility, malleability, corrosion resistance) can be varied by heating and cooling under certain conditions &mdash; this is <b>heat treatment</b>.</p>
    <ul>
      <li><b>Annealing</b> &mdash; steel is heated until bright red hot, then allowed to cool <b>slowly in air</b>. Makes steel <u>soft</u>.</li>
      <li><b>Hardening</b> &mdash; increases hardness. Red hot steel is plunged into <b>cold water or oil</b> as quickly as possible.</li>
      <li><b>Tempering</b> &mdash; hardened steel is reheated, then allowed to cool slowly in air.</li>
    </ul>
    <div class="callout"><b>Alloys vs pure metals:</b> alloys (like steel) are generally more useful than pure metals because their composition can be tuned to control hardness, strength, corrosion-resistance, and workability &mdash; properties pure iron alone cannot offer across all applications.</div>
  </div>

  <div class="section">
    <h2>Rusting of Iron</h2>
    <p>Rusting requires both <b>moisture (water) and oxygen (air)</b> &mdash; both promote/accelerate the rusting of iron poles.</p>
    <ul>
      <li><b>Painting prevents rusting</b> by forming a protective barrier that keeps air and moisture away from the metal surface.</li>
      <li>The part of a steel pole <b>in contact with the earth (soil)</b> rusts faster because soil retains moisture and can contain corrosive salts/acids in constant contact with the metal, plus poor aeration/drainage sustaining the electrochemical corrosion process.</li>
      <li>Other rust-prevention methods: galvanizing (zinc coating), greasing/oiling, alloying (stainless steel), electroplating, cathodic protection (sacrificial anode).</li>
    </ul>
  </div>

  <div class="section">
    <h2>Table 8.4 &mdash; Compounds of Some Metals</h2>
    <table>
      <tr><th>Compound</th><th>Formula</th><th>Key Uses</th></tr>
      <tr><td>Common salt</td><td class="chem">NaCl</td><td>Flavouring food, freezing mixtures, melting ice/snow, salting out soap from glycerine, manufacture of HCl, NaOH, Na&#8322;CO&#8323;</td></tr>
      <tr><td>Washing soda</td><td class="chem">Na&#8322;CO&#8323;&middot;10H&#8322;O</td><td>Washing soda; manufacture of caustic soda, glass</td></tr>
      <tr><td>Baking soda</td><td class="chem">NaHCO&#8323;</td><td>Baking powder; portable fire extinguishers</td></tr>
      <tr><td>Salt peter</td><td class="chem">KCl</td><td>Used by hypertension patients in food; makes potassium nitrate</td></tr>
      <tr><td>Nitre</td><td class="chem">KNO&#8323;</td><td>Making gunpowder</td></tr>
      <tr><td>Marble</td><td class="chem">CaCO&#8323;</td><td>Glass, cement, quick lime, pottery; flux in iron manufacture; toothpaste; calcium manufacture</td></tr>
      <tr><td>Quick lime</td><td class="chem">CaO</td><td>Flux in extraction of metals; drying agent; soda lime</td></tr>
      <tr><td>Slaked lime</td><td class="chem">Ca(OH)&#8322;</td><td>Mortar &amp; lime plaster; removes acidity from soil; bleaching powder manufacture</td></tr>
      <tr><td>Gypsum</td><td class="chem">CaSO&#8324;&middot;2H&#8322;O</td><td>Controls cement setting time; paper filler</td></tr>
      <tr><td>Plaster of paris</td><td class="chem">(CaSO&#8324;)&#8322;&middot;H&#8322;O</td><td>Surgical bandages/casts; decorating walls/ceilings</td></tr>
      <tr><td>Alum</td><td class="chem">K&#8322;SO&#8324;&middot;Al&#8322;(SO&#8324;)&#8323;&middot;24H&#8322;O</td><td>Mordant; water purification; foam fire extinguisher</td></tr>
      <tr><td>Copper sulphate</td><td class="chem">CuSO&#8324;&middot;5H&#8322;O</td><td>Fungicide in Bordeaux mixture; electrolyte</td></tr>
      <tr><td>Zinc oxide</td><td class="chem">ZnO</td><td>Pigments in paints; rubber filler; cosmetics</td></tr>
      <tr><td>Calamine</td><td class="chem">ZnCO&#8323;</td><td>Ingredient of calamine lotion</td></tr>
    </table>
    <div class="callout">
      <b>Why NaCl melts ice/snow?</b> It depresses the freezing point of water (freezing-point depression).<br><br>

  flashcardEl.classList.remove('flipped');
  fcFront.textContent = card.f;
  fcBack.textContent = card.b;
  fcProgress.textContent = `CARD ${fcIndex+1} / ${flashData.length}`;
}
renderCard();

flashcardEl.addEventListener('click', ()=> flashcardEl.classList.toggle('flipped'));
document.getElementById('fcFlip').addEventListener('click', ()=> flashcardEl.classList.toggle('flipped'));
document.getElementById('fcNext').addEventListener('click', ()=>{
  fcIndex = (fcIndex+1) % flashData.length;
  renderCard();
});
document.getElementById('fcPrev').addEventListener('click', ()=>{
  fcIndex = (fcIndex-1+flashData.length) % flashData.length;
  renderCard();
});
document.getElementById('fcShuffle').addEventListener('click', ()=>{
  for(let i=fcOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [fcOrder[i],fcOrder[j]] = [fcOrder[j],fcOrder[i]];
  }
  fcIndex = 0;
  renderCard();
});

/* ============================================================
   QUIZ LOGIC
   ============================================================ */
let quizOrder = quizData.map((_,i)=>i);
let quizIndex = 0;
let quizScore = 0;
let answered = false;

const quizArea = document.getElementById('quizArea');

function renderQuiz(){
  if(quizIndex >= quizOrder.length){
    quizArea.innerHTML = `
      <div class="quiz-result">
        <h2>${quizScore} / ${quizOrder.length}</h2>
        <p>You scored ${Math.round(quizScore/quizOrder.length*100)}%</p>
        <div class="fc-controls" style="max-width:340px;margin:20px auto 0;">
          <button class="fc-btn primary" id="quizRestart">Restart Quiz</button>
        </div>
      </div>`;
    document.getElementById('quizRestart').addEventListener('click', startQuiz);
    return;
  }
  answered = false;
  const q = quizData[quizOrder[quizIndex]];
  quizArea.innerHTML = `
    <div class="quiz-head">
      <span>QUESTION ${quizIndex+1} / ${quizOrder.length}</span>
      <span class="quiz-score">SCORE: ${quizScore}</span>
    </div>
    <div class="q-card">
      <div class="q-text">${q.q}</div>
      <div id="optsWrap"></div>
      <div class="q-explain" id="qExplain">${q.e}</div>
    </div>
    <div class="quiz-nav">
      <button class="fc-btn" id="quizNext" style="max-width:200px;">Next Question &rarr;</button>
    </div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  q.opts.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'q-opt';
    b.textContent = opt;
    b.addEventListener('click', ()=> selectAnswer(i, q));
    optsWrap.appendChild(b);
  });
}

function selectAnswer(i, q){
  if(answered) return;
  answered = true;
  if(i === q.a) quizScore++;
  document.querySelectorAll('.q-opt').forEach((el,idx)=>{
    el.disabled = true;
    if(idx === q.a) el.classList.add('correct');
    else if(idx === i) el.classList.add('incorrect');
  });
  document.getElementById('qExplain').classList.add('show');
}

document.addEventListener('click', (e)=>{
  if(e.target && e.target.id === 'quizNext'){
    quizIndex++;
    renderQuiz();
  }
});

function startQuiz(){
  quizOrder = quizData.map((_,i)=>i);
  for(let i=quizOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [quizOrder[i],quizOrder[j]] = [quizOrder[j],quizOrder[i]];
  }
  quizIndex = 0;
  quizScore = 0;
  renderQuiz();
}
startQuiz();
</script>
